        // ============ COMPONENTE DASHBOARD MEJORADO ============
        const Dashboard = ({ usuario }) => {
            const [clientes, setClientes] = useState([]);
            const [tareas, setTareas] = useState([]);
            const [usuarios, setUsuarios] = useState([]);
            const [mostrarReporte, setMostrarReporte] = useState(false);
            const [refreshPresencias, setRefreshPresencias] = useState(0);
            const [fechaInicio, setFechaInicio] = useState(() => {
                const fecha = new Date();
                fecha.setDate(1);
                const año = fecha.getFullYear();
                const mes = String(fecha.getMonth() + 1).padStart(2, '0');
                return `${año}-${mes}-01`;
            });
            const [fechaFin, setFechaFin] = useState(obtenerFechaLocal());

            useEffect(() => {
                setClientes(DB.get('clientes') || []);
                setTareas(DB.get('tareas') || []);
                setUsuarios(DB.get('users') || []);
            }, []);
            
            // Refrescar presencias desde servidor cada 10 segundos
            useEffect(() => {
                const sincronizarPresencias = async () => {
                    try {
                        const response = await fetch(`${API_URL}/presencias`);
                        if (response.ok) {
                            const presencias = await response.json();
                            DB.dataCache['presencias'] = presencias;
                            setRefreshPresencias(prev => prev + 1); // Forzar re-render
                        }
                    } catch (error) {
                        console.warn('[PRESENCIAS] Error sincronizando:', error);
                    }
                };
                
                // Sincronizar inmediatamente
                sincronizarPresencias();
                
                // Luego cada 10 segundos
                const interval = setInterval(sincronizarPresencias, 10000);
                
                return () => clearInterval(interval);
            }, []);

            const clientesActivos = clientes.filter(c => c.estado === 'Activo').length;
            const tareasPendientes = tareas.filter(t => t.estado === 'Pendiente' || t.estado === 'En curso').length;
            const hoy = obtenerFechaLocal();
            const tareasHoy = tareas.filter(t => t.vencimiento === hoy && t.estado !== 'Terminado').length;

            // Calcular horas trabajadas por usuario
            const calcularHorasPorUsuario = () => {
                const horasPorUsuario = {};
                usuarios.forEach(u => {
                    const tareasFiltradas = tareas.filter(t => {
                        if (!t.fechaCreacion) return false;
                        const fechaCreacion = t.fechaCreacion.split('T')[0];
                        return t.responsableId === u.id && 
                               fechaCreacion >= fechaInicio && 
                               fechaCreacion <= fechaFin;
                    });
                    const totalSegundos = tareasFiltradas.reduce((sum, t) => sum + (t.tiempoTotal || 0), 0);
                    horasPorUsuario[u.id] = {
                        nombre: u.nombre,
                        rol: u.rol,
                        horas: Math.floor(totalSegundos / 3600),
                        minutos: Math.floor((totalSegundos % 3600) / 60)
                    };
                });
                return horasPorUsuario;
            };

            // Calcular matriz usuario-cliente
            const calcularMatrizUsuarioCliente = () => {
                const matriz = {};
                clientes.forEach(cliente => {
                    matriz[cliente.id] = {
                        nombreCliente: cliente.nombre,
                        usuarios: {}
                    };
                    usuarios.forEach(u => {
                        const tareasFiltradas = tareas.filter(t => {
                            if (!t.fechaCreacion) return false;
                            const fechaCreacion = t.fechaCreacion.split('T')[0];
                            return t.clienteId === cliente.id && 
                                   t.responsableId === u.id &&
                                   fechaCreacion >= fechaInicio && 
                                   fechaCreacion <= fechaFin;
                        });
                        const totalSegundos = tareasFiltradas.reduce((sum, t) => sum + (t.tiempoTotal || 0), 0);
                        if (totalSegundos > 0) {
                            matriz[cliente.id].usuarios[u.id] = {
                                nombre: u.nombre,
                                horas: Math.floor(totalSegundos / 3600),
                                minutos: Math.floor((totalSegundos % 3600) / 60)
                            };
                        }
                    });
                });
                return matriz;
            };

            return (
                <div>

                        <p>Bienvenido, {usuario.nombre}</p>

                        </div>
                        <div className="stat-card">
                            <h3>Tareas Pendientes</h3>
                            <div className="value">{tareasPendientes}</div>
                        </div>
                        <div className="stat-card">
                            <h3>Clientes Activos</h3>
                            <div className="value">{clientesActivos}</div>
                        </div>
                        <div className="stat-card">
                            <h3>Total Tareas</h3>
                            <div className="value">{tareas.length}</div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h2>👥 Estado del Equipo</h2>
                        </div>
                        <div className="card-body">
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '16px'}}>

                                    <div key={u.id} style={{
                                        padding: '12px', 
                                        background: 'var(--bg-main)', 
                                        borderRadius: '8px',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '12px'
                                    }}>
                                        <div style={{
                                            width: '12px',
                                            height: '12px',
                                            borderRadius: '50%',
                                            background: DB.estaConectado(u.id) ? '#10b981' : '#d1d5db',
                                            boxShadow: DB.estaConectado(u.id) ? '0 0 8px #10b981' : 'none'
                                        }} />
                                        <div>
                                            <div style={{fontWeight: '600', fontSize: '14px'}}>{u.nombre}</div>
                                            <div style={{fontSize: '12px', color: 'var(--text-secondary)'}}>{u.rol}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <p style={{marginTop: '16px', fontSize: '13px', color: 'var(--text-secondary)', fontStyle: 'italic'}}>
                                💡 Luz verde = Usuario conectado en este momento
                            </p>
                        </div>
                    </div>

                    {/* Reporte de Horas - Solo para Socios */}
                    {usuario.rol === 'Socio' && (
                        <div className="card">
                            <div className="card-header">
                                <h2>📊 Reportes de Productividad</h2>
                                <button className="btn btn-primary btn-sm" onClick={() => setMostrarReporte(!mostrarReporte)}>
                                    {mostrarReporte ? 'Ocultar Reporte' : 'Ver Reporte'}
                                </button>
                            </div>
                            
                            {mostrarReporte && (
                                <div className="card-body">
                                    <div style={{display: 'flex', gap: '16px', marginBottom: '24px', padding: '16px', background: 'var(--bg-main)', borderRadius: '8px'}}>
                                        <div style={{flex: 1}}>
                                            <label style={{display: 'block', marginBottom: '8px', fontSize: '14px', fontWeight: '500'}}>Fecha Inicio</label>
                                            <input 
                                                type="date" 
                                                className="form-control" 
                                                value={fechaInicio}

                                        </div>
                                        <div style={{flex: 1}}>
                                            <label style={{display: 'block', marginBottom: '8px', fontSize: '14px', fontWeight: '500'}}>Fecha Fin</label>
                                            <input 
                                                type="date" 
                                                className="form-control" 
                                                value={fechaFin}
                                                onChange={(e) => setFechaFin(e.target.value)}
                                            />
                                        </div>
                                    </div>

                                    <h3 style={{fontSize: '16px', fontWeight: '600', marginBottom: '16px'}}>Horas Trabajadas por Usuario</h3>
                                    <div style={{overflowX: 'auto', marginBottom: '32px'}}>
                                        <table style={{width: '100%', borderCollapse: 'collapse'}}>
                                            <thead>
                                                <tr style={{background: 'var(--bg-main)'}}>
                                                    <th style={{padding: '12px', textAlign: 'left', borderBottom: '2px solid var(--border)'}}>Usuario</th>
                                                    <th style={{padding: '12px', textAlign: 'left', borderBottom: '2px solid var(--border)'}}>Rol</th>
                                                    <th style={{padding: '12px', textAlign: 'right', borderBottom: '2px solid var(--border)'}}>Horas Trabajadas</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {Object.values(calcularHorasPorUsuario()).map((data, idx) => (
                                                    <tr key={idx} style={{borderBottom: '1px solid var(--border)'}}>
                                                        <td style={{padding: '12px'}}>{data.nombre}</td>
                                                        <td style={{padding: '12px'}}>{data.rol}</td>
                                                        <td style={{padding: '12px', textAlign: 'right', fontWeight: '600'}}>
                                                            {data.horas}h {data.minutos}m
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>

                                    <h3 style={{fontSize: '16px', fontWeight: '600', marginBottom: '16px'}}>Matriz: Horas por Cliente y Usuario</h3>
                                    <div style={{overflowX: 'auto'}}>
                                        <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '13px'}}>
                                            <thead>
                                                <tr style={{background: 'var(--bg-main)'}}>
                                                    <th style={{padding: '8px', textAlign: 'left', borderBottom: '2px solid var(--border)', position: 'sticky', left: 0, background: 'var(--bg-main)'}}>Cliente</th>
                                                    {usuarios.map(u => (
                                                        <th key={u.id} style={{padding: '8px', textAlign: 'center', borderBottom: '2px solid var(--border)', minWidth: '80px'}}>
                                                            {u.nombre}
                                                        </th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {Object.values(calcularMatrizUsuarioCliente()).map((fila, idx) => {
                                                    const tieneHoras = Object.keys(fila.usuarios).length > 0;
                                                    if (!tieneHoras) return null;
                                                    
                                                    return (
                                                        <tr key={idx} style={{borderBottom: '1px solid var(--border)'}}>
                                                            <td style={{padding: '8px', fontWeight: '500', position: 'sticky', left: 0, background: 'white'}}>
                                                                {fila.nombreCliente}
                                                            </td>
                                                            {usuarios.map(u => {
                                                                const datos = fila.usuarios[u.id];
                                                                return (
                                                                    <td key={u.id} style={{padding: '8px', textAlign: 'center'}}>
                                                                        {datos ? `${datos.horas}h ${datos.minutos}m` : '-'}
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {usuario.rol === 'Socio' && (
                        <div className="card" style={{marginTop: '24px'}}>
                            <div className="card-header" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                <h2>👥 Gestión de Usuarios</h2>
                                <button className="btn btn-primary btn-sm" onClick={() => alert('Funcionalidad en desarrollo - Pronto podrás agregar usuarios')}>
                                    + Nuevo Usuario
                                </button>
                            </div>
                            <div className="card-body">
                                <table style={{width: '100%', borderCollapse: 'collapse'}}>
                                    <thead>
                                        <tr style={{borderBottom: '2px solid var(--border)', background: 'var(--bg-main)'}}>
                                            <th style={{padding: '12px', textAlign: 'left'}}>Nombre</th>
                                            <th style={{padding: '12px', textAlign: 'left'}}>Email</th>
                                            <th style={{padding: '12px', textAlign: 'left'}}>Rol</th>
                                            <th style={{padding: '12px', textAlign: 'center'}}>Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {usuarios.map(u => (
                                            <tr key={u.id} style={{borderBottom: '1px solid var(--border)'}}>
                                                <td style={{padding: '12px'}}>{u.nombre}</td>
                                                <td style={{padding: '12px', fontSize: '13px', color: 'var(--text-secondary)'}}>{u.email}</td>
                                                <td style={{padding: '12px'}}>
                                                    <select 
                                                        value={u.rol} 
                                                        onChange={(e) => {

                                                            setUsuarios(nuevosUsuarios);

                                                        className="form-control"

                            </div>
                        </div>
                    )}

                </div>
            );
        };

        // ============ COMPONENTE CLIENTES ============
        const Clientes = ({ usuario }) => {
            const [clientes, setClientes] = useState([]);
            const [usuarios, setUsuarios] = useState([]);
            const [mostrarModal, setMostrarModal] = useState(false);
            const [clienteEdit, setClienteEdit] = useState(null);
            const [clienteVerDatos, setClienteVerDatos] = useState(null);
            const [busqueda, setBusqueda] = useState('');
            const [filtroEstado, setFiltroEstado] = useState('Todos');

            const [filtroSupervisor, setFiltroSupervisor] = useState(null);

            useEffect(() => {
                setClientes(DB.get('clientes') || []);
                setUsuarios(DB.get('users') || []);
                
                // Leer filtro de supervisor si viene de "Mis Clientes"
                const filtro = sessionStorage.getItem('filtroSupervisorClientes');
                if (filtro) {
                    setFiltroSupervisor(filtro);
                    sessionStorage.removeItem('filtroSupervisorClientes');
                }
            }, []);

            const handleEliminarTarea = (tareaId) => {
                if (!window.confirm('¿Estás seguro de que querés eliminar esta tarea? Esta acción no se puede deshacer.')) {
                    return;
                }
                
                const tareasActualizadas = tareas.filter(t => t.id !== tareaId);
                setTareas(tareasActualizadas);
                DB.set('tareas', tareasActualizadas);
                registrarAuditoria('tarea_eliminada', { tareaId }, usuario.id);
                
                // Cerrar modal si está abierto
                setMostrarDetalle(false);
                setTareaDetalle(null);
            };



            const handleGuardar = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                const cliente = {
                    id: clienteEdit?.id || Date.now(),
                    nombre: formData.get('nombre'),
                    estado: formData.get('estado'),
                    ficha: formData.get('ficha'),
                    servicios: {
                        contabilidad: formData.get('contabilidad') === 'on',
                        sueldos: formData.get('sueldos') === 'on',
                        impuestos: formData.get('impuestos') === 'on',
                        regimenInformativo: formData.get('regimenInformativo')
                    },
                    socioId: parseInt(formData.get('socioId')),
                    supervisorId: parseInt(formData.get('supervisorId')),
                    auxiliarId: parseInt(formData.get('auxiliarId')),
                    generarTareasAutomaticas: formData.get('generarTareasAutomaticas') === 'on',
                    servicioContabilidad: formData.get('servicioContabilidad') === 'on',
                    servicioSueldos: formData.get('servicioSueldos') === 'on',
                    servicioImpuestos: formData.get('servicioImpuestos') === 'on',
                    datosAdicionales: {
                        numeroBPS: formData.get('numeroBPS') || '',
                        usuarioBPS: formData.get('usuarioBPS') || '',
                        claveBPS: formData.get('claveBPS') || '',
                        ciCliente: formData.get('ciCliente') || '',
                        usuarioGub: formData.get('usuarioGub') || '',
                        claveGub: formData.get('claveGub') || '',
                        claveCJPPU: formData.get('claveCJPPU') || '',
                        rut: formData.get('rut') || ''
                    }
                };

                const clientesActualizados = clienteEdit
                    ? clientes.map(c => c.id === clienteEdit.id ? cliente : c)
                    : [...clientes, cliente];

                DB.set('clientes', clientesActualizados);
                setClientes(clientesActualizados);
                registrarAuditoria('cliente_modificado', cliente, usuario.id);
                setMostrarModal(false);
                setClienteEdit(null);

                // Generar tareas automáticas si está activado
                if (cliente.generarTareasAutomaticas && !clienteEdit) {
                    generarTareasRecurrentes(cliente);
                }
            };

            const generarTareasRecurrentes = (cliente) => {
                const tareas = DB.get('tareas') || [];
                const nuevasTareas = [];

                // 1. Solicitud de información (día 1)
                nuevasTareas.push({
                    id: Date.now() + 1,
                    clienteId: cliente.id,
                    titulo: 'Solicitud de Información',
                    servicio: 'General',
                    responsableId: cliente.supervisorId,
                    supervisorOrigenId: cliente.supervisorId,
                    vencimiento: calcularVencimiento(1),
                    estado: 'Pendiente',
                    prioridad: 'alta',
                    checklist: [
                        { id: 1, texto: 'Envío mail', completado: false },
                        { id: 2, texto: 'Recepción información', completado: false },
                        { id: 3, texto: 'Validación información', completado: false }
                    ],
                    tiempoTotal: 0,
                    enCursoDesde: null,
                    creadoPor: usuarioActual.id,
                    fechaCreacion: new Date().toISOString()
                });

                // 2. Sueldos (si aplica)
                if (cliente.servicios.sueldos) {
                    nuevasTareas.push({
                        id: Date.now() + 2,
                        clienteId: cliente.id,
                        titulo: 'Liquidación de Sueldos',
                        servicio: 'Sueldos',
                        responsableId: cliente.auxiliarId,
                        supervisorOrigenId: cliente.supervisorId,
                        vencimiento: calcularVencimiento(5),
                        estado: 'Pendiente',
                        prioridad: 'alta',
                        checklist: [
                            { id: 1, texto: 'Liquidación GNS', completado: false },
                            { id: 2, texto: 'Control aportes', completado: false },
                            { id: 3, texto: 'Control IRPF', completado: false },
                            { id: 4, texto: 'Envío nóminas', completado: false }
                        ],
                        tiempoTotal: 0,
                        enCursoDesde: null,
                        creadoPor: usuarioActual.id,
                        fechaCreacion: new Date().toISOString()
                    });
                }

                // 3. Contabilidad (si aplica)
                if (cliente.servicios.contabilidad) {
                    nuevasTareas.push({
                        id: Date.now() + 3,
                        clienteId: cliente.id,
                        titulo: 'Procesamiento Contable',
                        servicio: 'Contabilidad',
                        responsableId: cliente.auxiliarId,
                        supervisorOrigenId: cliente.supervisorId,
                        vencimiento: calcularVencimiento(15),
                        estado: 'Pendiente',
                        prioridad: 'media',
                        checklist: [
                            { id: 1, texto: 'Procesamiento documentación', completado: false },
                            { id: 2, texto: 'Conciliaciones bancarias', completado: false }
                        ],
                        tiempoTotal: 0,
                        enCursoDesde: null,
                        creadoPor: usuarioActual.id,
                        fechaCreacion: new Date().toISOString()
                    });
                }

                // 4. Impuestos (si aplica)
                if (cliente.servicios.impuestos) {
                    nuevasTareas.push({
                        id: Date.now() + 4,
                        clienteId: cliente.id,
                        titulo: 'Liquidación de Impuestos',
                        servicio: 'Impuestos',
                        responsableId: cliente.auxiliarId,
                        supervisorOrigenId: cliente.supervisorId,
                        vencimiento: calcularVencimiento(22),
                        estado: 'Pendiente',
                        prioridad: 'alta',
                        checklist: [
                            { id: 1, texto: 'Liquidación planilla', completado: false },
                            { id: 2, texto: 'Emisión boleto', completado: false },
                            { id: 3, texto: 'Envío boleto', completado: false }
                        ],
                        tiempoTotal: 0,
                        enCursoDesde: null,
                        creadoPor: usuarioActual.id,
                        fechaCreacion: new Date().toISOString()
                    });
                }

                DB.set('tareas', [...tareas, ...nuevasTareas]);
            };

            // Filtrar por supervisor (si viene de "Mis Clientes")
            let clientesBase = filtroSupervisor
                ? clientes.filter(c => c.supervisorId === parseInt(filtroSupervisor))
                : clientes;
            
            // Filtrar por estado
            let clientesFiltrados = filtroEstado === 'Todos'
