services:
  rmi-uploader:
    build: ./uploader
    container_name: rmi-uploader
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /tmp/rmi:/tmp/rmi
      - ./update-rmi.sh:/update-rmi.sh:ro
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/gestion-rmi/prod:/srv/gestion-rmi/prod
      - /srv/gestion-rmi/testing:/srv/gestion-rmi/testing
      - /srv/contabilidad-rmi/rmi-contabilidad:/srv/contabilidad-rmi/rmi-contabilidad
    env_file:
      - .env
    networks:
      - rmi-network

  rmi-sistema:
    build: .
    container_name: rmi-sistema
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - rmi-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/data', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  rmi-network:
    driver: bridge

volumes:
  rmi-data:
    driver: local
