version: '3.8'

services:
  rmi-sistema:
    build: .
    container_name: rmi-sistema
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Volumen persistente para la base de datos
      - ./data:/app/data
      # Volumen para logs (opcional)
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - rmi-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/data', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  rmi-network:
    driver: bridge

volumes:
  rmi-data:
    driver: local
